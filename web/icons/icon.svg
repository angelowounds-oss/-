<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="50%" style="stop-color:#17213d"/>
      <stop offset="100%" style="stop-color:#0f3361"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  <g transform="translate(256, 256)">
    <!-- Checkmark circle -->
    <circle cx="0" cy="-20" r="100" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="8"/>
    <circle cx="0" cy="-20" r="100" fill="none" stroke="#34c759" stroke-width="8" stroke-dasharray="628" stroke-dashoffset="157" stroke-linecap="round" transform="rotate(-90, 0, -20)"/>
    <polyline points="-35,-25 -10,5 40,-40" fill="none" stroke="#34c759" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" transform="translate(0, -15)"/>
    <!-- Lines representing list items -->
    <rect x="-80" y="110" width="160" height="8" rx="4" fill="rgba(255,255,255,0.2)"/>
    <rect x="-60" y="135" width="120" height="6" rx="3" fill="rgba(255,255,255,0.1)"/>
  </g>
</svg>
