<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>슬로우 로드 - Slow Road</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { overflow: hidden; background: #000; font-family: 'Segoe UI', sans-serif; }
    canvas { display: block; }

    #ui {
      position: fixed;
      bottom: 30px;
      left: 30px;
      color: #fff;
      pointer-events: none;
      z-index: 10;
    }
    #speedometer {
      font-size: 48px;
      font-weight: 300;
      letter-spacing: -2px;
      text-shadow: 0 2px 8px rgba(0,0,0,0.5);
    }
    #speedometer span {
      font-size: 18px;
      font-weight: 400;
      letter-spacing: 0;
      opacity: 0.7;
    }

    #hint {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: #fff;
      text-align: center;
      font-size: 20px;
      font-weight: 300;
      letter-spacing: 1px;
      text-shadow: 0 2px 8px rgba(0,0,0,0.5);
      opacity: 1;
      transition: opacity 2s ease;
      pointer-events: none;
      z-index: 10;
      line-height: 1.8;
    }
    #hint .title {
      font-size: 42px;
      font-weight: 200;
      letter-spacing: 6px;
      margin-bottom: 20px;
      display: block;
    }
    #hint .keys {
      font-size: 16px;
      opacity: 0.7;
    }
  </style>

  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.171.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.171.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>

  <div id="ui">
    <div id="speedometer">0 <span>km/h</span></div>
  </div>

  <div id="hint">
    <span class="title">SLOW ROAD</span>
    W / ↑ 가속 &nbsp;&nbsp; S / ↓ 감속<br>
    A / ↑ 좌회전 &nbsp;&nbsp; D / → 우회전<br>
    <span class="keys">아무 키나 눌러 시작하세요</span>
  </div>

  <script type="module">
    import * as THREE from 'three';

    // ============================================================
    // === Constants & Config ===
    // ============================================================
    const CONFIG = {
      roadWidth: 8,
      roadSegmentLength: 60,
      roadPointsPerSegment: 20,
      chunksAhead: 8,
      chunksBehind: 2,
      maxSpeed: 120,
      acceleration: 40,
      braking: 60,
      friction: 15,
      steerSpeed: 3.0,
      steerReturn: 4.0,
      maxLaneOffset: 3.5,
      cameraHeight: 4,
      cameraDistance: 10,
      cameraSmoothing: 3.0,
      treeDensity: 6,
      treeSpread: 30,
      fogNear: 80,
      fogFar: 500,
    };

    // ============================================================
    // === Scene Setup ===
    // ============================================================
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x87CEEB);
    scene.fog = new THREE.Fog(0x87CEEB, CONFIG.fogNear, CONFIG.fogFar);

    const camera = new THREE.PerspectiveCamera(65, window.innerWidth / window.innerHeight, 0.5, 2000);
    camera.position.set(0, CONFIG.cameraHeight, CONFIG.cameraDistance);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.2;
    document.body.appendChild(renderer.domElement);

    // Lights
    const ambientLight = new THREE.AmbientLight(0xffeedd, 0.6);
    scene.add(ambientLight);

    const sunLight = new THREE.DirectionalLight(0xffffff, 1.2);
    sunLight.position.set(50, 80, 30);
    sunLight.castShadow = true;
    sunLight.shadow.mapSize.width = 2048;
    sunLight.shadow.mapSize.height = 2048;
    sunLight.shadow.camera.near = 1;
    sunLight.shadow.camera.far = 300;
    sunLight.shadow.camera.left = -80;
    sunLight.shadow.camera.right = 80;
    sunLight.shadow.camera.top = 80;
    sunLight.shadow.camera.bottom = -80;
    scene.add(sunLight);

    const hemiLight = new THREE.HemisphereLight(0x87CEEB, 0x556B2F, 0.4);
    scene.add(hemiLight);

    // Resize handler
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // ============================================================
    // === Simple Noise (for terrain variation) ===
    // ============================================================
    function pseudoRandom(x, z) {
      const n = Math.sin(x * 127.1 + z * 311.7) * 43758.5453;
      return n - Math.floor(n);
    }

    function smoothNoise(x, z) {
      const ix = Math.floor(x), iz = Math.floor(z);
      const fx = x - ix, fz = z - iz;
      const sx = fx * fx * (3 - 2 * fx);
      const sz = fz * fz * (3 - 2 * fz);
      const a = pseudoRandom(ix, iz);
      const b = pseudoRandom(ix + 1, iz);
      const c = pseudoRandom(ix, iz + 1);
      const d = pseudoRandom(ix + 1, iz + 1);
      return a + (b - a) * sx + (c - a) * sz + (a - b - c + d) * sx * sz;
    }

    // ============================================================
    // === Road Generation ===
    // ============================================================
    const roadControlPoints = [];
    const roadChunks = new Map();
    let nextChunkIndex = 0;
    let totalDistance = 0;
    let globalCurve = null;
    let globalCurveLength = 0;

    // Materials
    const roadMaterial = new THREE.MeshStandardMaterial({
      color: 0x555555,
      roughness: 0.9,
      metalness: 0.0,
    });
    const lineMaterial = new THREE.MeshBasicMaterial({ color: 0xffffff });
    const grassMaterial = new THREE.MeshStandardMaterial({
      color: 0x6B8E23,
      roughness: 1.0,
      metalness: 0.0,
    });

    function generateControlPoint(index) {
      const z = -index * CONFIG.roadSegmentLength;
      const amplitude = 30 + index * 0.05;
      const x = Math.sin(index * 0.3) * amplitude * 0.3 +
                Math.sin(index * 0.13) * amplitude * 0.5 +
                Math.cos(index * 0.07) * amplitude * 0.2;
      const y = Math.sin(index * 0.08) * 3 + Math.sin(index * 0.2) * 1.5;
      return new THREE.Vector3(x, Math.max(y, 0.1), z);
    }

    function ensureControlPoints(upToIndex) {
      while (roadControlPoints.length <= upToIndex + 2) {
        const cp = generateControlPoint(roadControlPoints.length);
        roadControlPoints.push(cp);
      }
    }

    function rebuildGlobalCurve() {
      if (roadControlPoints.length < 4) return;
      globalCurve = new THREE.CatmullRomCurve3(roadControlPoints, false, 'centripetal', 0.5);
      globalCurveLength = globalCurve.getLength();
    }

    function buildRoadChunkMesh(chunkIndex) {
      const startCP = chunkIndex * 2;
      const endCP = startCP + 4;
      ensureControlPoints(endCP);
      rebuildGlobalCurve();

      if (!globalCurve) return null;

      const totalPts = globalCurve.points.length;
      const tStart = Math.max(0, startCP / (totalPts - 1));
      const tEnd = Math.min(1, (startCP + 3) / (totalPts - 1));

      const numPoints = CONFIG.roadPointsPerSegment;
      const positions = [];
      const uvs = [];
      const indices = [];
      const halfWidth = CONFIG.roadWidth / 2;

      const points = [];
      const tangents = [];
      for (let i = 0; i <= numPoints; i++) {
        const t = tStart + (tEnd - tStart) * (i / numPoints);
        const point = globalCurve.getPointAt(Math.min(t, 1));
        const tangent = globalCurve.getTangentAt(Math.min(t, 1));
        points.push(point);
        tangents.push(tangent);
      }

      const up = new THREE.Vector3(0, 1, 0);

      for (let i = 0; i <= numPoints; i++) {
        const point = points[i];
        const tangent = tangents[i];
        const right = new THREE.Vector3().crossVectors(tangent, up).normalize();

        const leftPt = new THREE.Vector3().copy(point).addScaledVector(right, -halfWidth);
        const rightPt = new THREE.Vector3().copy(point).addScaledVector(right, halfWidth);

        positions.push(leftPt.x, leftPt.y + 0.01, leftPt.z);
        positions.push(rightPt.x, rightPt.y + 0.01, rightPt.z);

        const v = i / numPoints;
        uvs.push(0, v);
        uvs.push(1, v);

        if (i < numPoints) {
          const base = i * 2;
          indices.push(base, base + 1, base + 2);
          indices.push(base + 1, base + 3, base + 2);
        }
      }

      const roadGeo = new THREE.BufferGeometry();
      roadGeo.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
      roadGeo.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
      roadGeo.setIndex(indices);
      roadGeo.computeVertexNormals();

      const roadMesh = new THREE.Mesh(roadGeo, roadMaterial);
      roadMesh.receiveShadow = true;

      const group = new THREE.Group();
      group.add(roadMesh);

      // Center line dashes
      for (let i = 0; i < numPoints; i += 2) {
        const p1 = points[i];
        const p2 = points[Math.min(i + 1, numPoints)];
        const dashGeo = new THREE.BufferGeometry();
        const dv = [];
        const t1 = tangents[i];
        const r1 = new THREE.Vector3().crossVectors(t1, up).normalize();
        const dashWidth = 0.15;
        dv.push(p1.x - r1.x * dashWidth, p1.y + 0.02, p1.z - r1.z * dashWidth);
        dv.push(p1.x + r1.x * dashWidth, p1.y + 0.02, p1.z + r1.z * dashWidth);
        dv.push(p2.x - r1.x * dashWidth, p2.y + 0.02, p2.z - r1.z * dashWidth);
        dv.push(p2.x + r1.x * dashWidth, p2.y + 0.02, p2.z + r1.z * dashWidth);
        dashGeo.setAttribute('position', new THREE.Float32BufferAttribute(dv, 3));
        dashGeo.setIndex([0, 1, 2, 1, 3, 2]);
        dashGeo.computeVertexNormals();
        const dashMesh = new THREE.Mesh(dashGeo, lineMaterial);
        group.add(dashMesh);
      }

      // Grass planes on both sides
      for (let i = 0; i <= numPoints; i++) {
        if (i >= numPoints) break;
        const p1 = points[i];
        const p2 = points[i + 1];
        const t1 = tangents[i];
        const r1 = new THREE.Vector3().crossVectors(t1, up).normalize();
        const grassWidth = CONFIG.treeSpread + 10;

        for (const side of [-1, 1]) {
          const gPositions = [];
          const innerOffset = halfWidth + 0.5;
          const outerOffset = halfWidth + grassWidth;

          const i1 = new THREE.Vector3().copy(p1).addScaledVector(r1, side * innerOffset);
          const o1 = new THREE.Vector3().copy(p1).addScaledVector(r1, side * outerOffset);

          const t2 = tangents[i + 1];
          const r2 = new THREE.Vector3().crossVectors(t2, up).normalize();
          const i2 = new THREE.Vector3().copy(p2).addScaledVector(r2, side * innerOffset);
          const o2 = new THREE.Vector3().copy(p2).addScaledVector(r2, side * outerOffset);

          const ny1 = smoothNoise(o1.x * 0.02, o1.z * 0.02) * 2 - 0.5;
          const ny2 = smoothNoise(o2.x * 0.02, o2.z * 0.02) * 2 - 0.5;

          gPositions.push(i1.x, i1.y, i1.z);
          gPositions.push(o1.x, o1.y + ny1, o1.z);
          gPositions.push(i2.x, i2.y, i2.z);
          gPositions.push(o2.x, o2.y + ny2, o2.z);

          const gGeo = new THREE.BufferGeometry();
          gGeo.setAttribute('position', new THREE.Float32BufferAttribute(gPositions, 3));
          gGeo.setIndex([0, 1, 2, 1, 3, 2]);
          gGeo.computeVertexNormals();
          const gMesh = new THREE.Mesh(gGeo, grassMaterial);
          gMesh.receiveShadow = true;
          group.add(gMesh);
        }
      }

      // Trees
      const trunkGeo = new THREE.CylinderGeometry(0.15, 0.2, 1.5, 5);
      const trunkMat = new THREE.MeshStandardMaterial({ color: 0x8B4513, roughness: 1 });
      const leafGeo = new THREE.ConeGeometry(1.2, 2.5, 6);
      const leafColors = [0x228B22, 0x2E8B57, 0x3CB371, 0x006400];

      for (let i = 0; i < numPoints; i += 3) {
        const p = points[i];
        const t = tangents[i];
        const r = new THREE.Vector3().crossVectors(t, up).normalize();

        for (let j = 0; j < CONFIG.treeDensity; j++) {
          const side = j % 2 === 0 ? -1 : 1;
          const dist = CONFIG.roadWidth / 2 + 4 + pseudoRandom(chunkIndex * 100 + i + j, j * 37) * CONFIG.treeSpread;
          const along = pseudoRandom(i + j * 13, chunkIndex) * CONFIG.roadSegmentLength * 0.3;

          const treePos = new THREE.Vector3()
            .copy(p)
            .addScaledVector(r, side * dist)
            .add(new THREE.Vector3(0, 0, -along * 0.3));

          treePos.y = smoothNoise(treePos.x * 0.02, treePos.z * 0.02) * 2;

          const scale = 0.8 + pseudoRandom(i * 7 + j, chunkIndex * 3) * 0.8;

          const trunk = new THREE.Mesh(trunkGeo, trunkMat);
          trunk.position.copy(treePos);
          trunk.position.y += 0.75 * scale;
          trunk.scale.setScalar(scale);
          trunk.castShadow = true;
          group.add(trunk);

          const leafColor = leafColors[Math.floor(pseudoRandom(i + j, chunkIndex * 11) * leafColors.length)];
          const leafMat = new THREE.MeshStandardMaterial({ color: leafColor, roughness: 0.8 });
          const leaves = new THREE.Mesh(leafGeo, leafMat);
          leaves.position.copy(treePos);
          leaves.position.y += 2.5 * scale;
          leaves.scale.setScalar(scale);
          leaves.castShadow = true;
          group.add(leaves);
        }
      }

      return { group, startT: tStart, endT: tEnd, points, tangents };
    }

    function updateRoadChunks(playerChunk) {
      const minChunk = playerChunk - CONFIG.chunksBehind;
      const maxChunk = playerChunk + CONFIG.chunksAhead;

      // Remove old chunks
      for (const [idx, chunk] of roadChunks) {
        if (idx < minChunk || idx > maxChunk) {
          scene.remove(chunk.group);
          chunk.group.traverse(child => {
            if (child.geometry) child.geometry.dispose();
          });
          roadChunks.delete(idx);
        }
      }

      // Add new chunks
      for (let i = minChunk; i <= maxChunk; i++) {
        if (i < 0) continue;
        if (!roadChunks.has(i)) {
          const chunk = buildRoadChunkMesh(i);
          if (chunk) {
            scene.add(chunk.group);
            roadChunks.set(i, chunk);
          }
        }
      }
    }

    // ============================================================
    // === Vehicle ===
    // ============================================================
    function createVehicle() {
      const group = new THREE.Group();

      // Body
      const bodyGeo = new THREE.BoxGeometry(2, 0.6, 3.5);
      const bodyMat = new THREE.MeshStandardMaterial({ color: 0xE74C3C, roughness: 0.3, metalness: 0.4 });
      const body = new THREE.Mesh(bodyGeo, bodyMat);
      body.position.y = 0.5;
      body.castShadow = true;
      group.add(body);

      // Cabin
      const cabinGeo = new THREE.BoxGeometry(1.6, 0.5, 1.8);
      const cabinMat = new THREE.MeshStandardMaterial({ color: 0xC0392B, roughness: 0.3, metalness: 0.3 });
      const cabin = new THREE.Mesh(cabinGeo, cabinMat);
      cabin.position.set(0, 1.05, -0.2);
      cabin.castShadow = true;
      group.add(cabin);

      // Windshield
      const windshieldGeo = new THREE.BoxGeometry(1.4, 0.4, 0.05);
      const windshieldMat = new THREE.MeshStandardMaterial({
        color: 0x87CEEB, roughness: 0.1, metalness: 0.8, transparent: true, opacity: 0.6
      });
      const windshield = new THREE.Mesh(windshieldGeo, windshieldMat);
      windshield.position.set(0, 1.05, -1.1);
      group.add(windshield);

      // Wheels
      const wheelGeo = new THREE.CylinderGeometry(0.3, 0.3, 0.2, 8);
      const wheelMat = new THREE.MeshStandardMaterial({ color: 0x222222, roughness: 0.8 });
      const wheelPositions = [
        [-1.1, 0.3, -1.0],
        [1.1, 0.3, -1.0],
        [-1.1, 0.3, 1.0],
        [1.1, 0.3, 1.0],
      ];
      const wheels = [];
      for (const [wx, wy, wz] of wheelPositions) {
        const wheel = new THREE.Mesh(wheelGeo, wheelMat);
        wheel.position.set(wx, wy, wz);
        wheel.rotation.z = Math.PI / 2;
        wheel.castShadow = true;
        group.add(wheel);
        wheels.push(wheel);
      }

      // Headlights
      const headlightGeo = new THREE.SphereGeometry(0.12, 6, 6);
      const headlightMat = new THREE.MeshBasicMaterial({ color: 0xFFFF99 });
      for (const side of [-0.7, 0.7]) {
        const hl = new THREE.Mesh(headlightGeo, headlightMat);
        hl.position.set(side, 0.55, -1.76);
        group.add(hl);
      }

      // Taillights
      const taillightMat = new THREE.MeshBasicMaterial({ color: 0xFF3333 });
      for (const side of [-0.7, 0.7]) {
        const tl = new THREE.Mesh(headlightGeo, taillightMat);
        tl.position.set(side, 0.55, 1.76);
        group.add(tl);
      }

      return { group, wheels };
    }

    const vehicle = createVehicle();
    scene.add(vehicle.group);

    // ============================================================
    // === Player State ===
    // ============================================================
    const player = {
      distance: 0,
      speed: 0,
      laneOffset: 0,
      steerInput: 0,
    };

    // ============================================================
    // === Controls ===
    // ============================================================
    const keys = {};
    let gameStarted = false;
    const hintEl = document.getElementById('hint');

    window.addEventListener('keydown', (e) => {
      keys[e.code] = true;
      if (!gameStarted) {
        gameStarted = true;
        hintEl.style.opacity = '0';
        setTimeout(() => hintEl.style.display = 'none', 2000);
      }
    });
    window.addEventListener('keyup', (e) => {
      keys[e.code] = false;
    });

    // ============================================================
    // === Camera State ===
    // ============================================================
    const cameraPos = new THREE.Vector3();
    const cameraTarget = new THREE.Vector3();

    // ============================================================
    // === Ground Plane (far background) ===
    // ============================================================
    const groundGeo = new THREE.PlaneGeometry(2000, 2000);
    const groundMat = new THREE.MeshStandardMaterial({ color: 0x7CCD7C, roughness: 1 });
    const ground = new THREE.Mesh(groundGeo, groundMat);
    ground.rotation.x = -Math.PI / 2;
    ground.position.y = -0.5;
    ground.receiveShadow = true;
    scene.add(ground);

    // ============================================================
    // === UI ===
    // ============================================================
    const speedometerEl = document.getElementById('speedometer');

    // ============================================================
    // === Game Loop ===
    // ============================================================
    const clock = new THREE.Clock();

    function getPositionOnRoad(distance, laneOffset) {
      if (!globalCurve || globalCurveLength === 0) return { position: new THREE.Vector3(), tangent: new THREE.Vector3(0, 0, -1) };

      const t = Math.min(Math.max(distance / globalCurveLength, 0), 0.999);
      const position = globalCurve.getPointAt(t);
      const tangent = globalCurve.getTangentAt(t);
      const up = new THREE.Vector3(0, 1, 0);
      const right = new THREE.Vector3().crossVectors(tangent, up).normalize();

      position.addScaledVector(right, laneOffset);

      return { position, tangent, right };
    }

    function animate() {
      requestAnimationFrame(animate);
      const dt = Math.min(clock.getDelta(), 0.05);

      if (!gameStarted) {
        // Idle animation - gentle sway
        if (globalCurve) {
          const idlePos = getPositionOnRoad(5, 0);
          vehicle.group.position.copy(idlePos.position);
          vehicle.group.position.y += 0.3;

          const lookDir = idlePos.tangent.clone().negate();
          const targetQuat = new THREE.Quaternion();
          const m = new THREE.Matrix4().lookAt(new THREE.Vector3(), lookDir, new THREE.Vector3(0, 1, 0));
          targetQuat.setFromRotationMatrix(m);
          vehicle.group.quaternion.slerp(targetQuat, 0.05);

          camera.position.set(
            idlePos.position.x,
            idlePos.position.y + CONFIG.cameraHeight + 2,
            idlePos.position.z + CONFIG.cameraDistance + 5
          );
          camera.lookAt(idlePos.position.x, idlePos.position.y + 1, idlePos.position.z);
        }

        // Initial road generation
        ensureControlPoints(CONFIG.chunksAhead * 2 + 4);
        rebuildGlobalCurve();
        updateRoadChunks(0);

        renderer.render(scene, camera);
        return;
      }

      // === Input ===
      const accel = keys['KeyW'] || keys['ArrowUp'];
      const brake = keys['KeyS'] || keys['ArrowDown'];
      const steerLeft = keys['KeyA'] || keys['ArrowLeft'];
      const steerRight = keys['KeyD'] || keys['ArrowRight'];

      // === Physics ===
      if (accel) {
        player.speed += CONFIG.acceleration * dt;
      } else if (brake) {
        player.speed -= CONFIG.braking * dt;
      } else {
        player.speed -= CONFIG.friction * dt;
      }
      player.speed = Math.max(0, Math.min(player.speed, CONFIG.maxSpeed));

      // Steering
      if (steerLeft) {
        player.steerInput -= CONFIG.steerSpeed * dt;
      } else if (steerRight) {
        player.steerInput += CONFIG.steerSpeed * dt;
      } else {
        // Return to center
        if (Math.abs(player.steerInput) < 0.05) {
          player.steerInput = 0;
        } else {
          player.steerInput -= Math.sign(player.steerInput) * CONFIG.steerReturn * dt;
        }
      }
      player.steerInput = Math.max(-1, Math.min(1, player.steerInput));

      player.laneOffset += player.steerInput * (player.speed / CONFIG.maxSpeed) * 8 * dt;
      player.laneOffset = Math.max(-CONFIG.maxLaneOffset, Math.min(CONFIG.maxLaneOffset, player.laneOffset));

      // Distance traveled
      player.distance += player.speed * dt * 0.5;

      // Ensure enough road
      const playerChunk = Math.floor(player.distance / (CONFIG.roadSegmentLength * 1.5));
      ensureControlPoints((playerChunk + CONFIG.chunksAhead + 2) * 2 + 4);
      rebuildGlobalCurve();
      updateRoadChunks(playerChunk);

      // === Vehicle Position ===
      const roadInfo = getPositionOnRoad(player.distance, player.laneOffset);
      vehicle.group.position.copy(roadInfo.position);
      vehicle.group.position.y += 0.3;

      // Vehicle rotation
      const lookDir = roadInfo.tangent.clone().negate();
      // Add slight tilt for steering
      const steerAngle = -player.steerInput * 0.15;
      const targetQuat = new THREE.Quaternion();
      const m = new THREE.Matrix4().lookAt(new THREE.Vector3(), lookDir, new THREE.Vector3(0, 1, 0));
      targetQuat.setFromRotationMatrix(m);
      const tiltQuat = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0, 0, 1), steerAngle);
      targetQuat.multiply(tiltQuat);
      vehicle.group.quaternion.slerp(targetQuat, 8 * dt);

      // Spin wheels
      const wheelSpin = player.speed * dt * 0.3;
      vehicle.wheels.forEach(w => w.rotation.x += wheelSpin);

      // === Camera ===
      const camBehind = roadInfo.tangent.clone().multiplyScalar(CONFIG.cameraDistance);
      const idealCamPos = vehicle.group.position.clone()
        .add(camBehind)
        .add(new THREE.Vector3(0, CONFIG.cameraHeight, 0));

      cameraPos.lerp(idealCamPos, CONFIG.cameraSmoothing * dt);
      camera.position.copy(cameraPos);

      const lookTarget = vehicle.group.position.clone().add(new THREE.Vector3(0, 1.5, 0));
      cameraTarget.lerp(lookTarget, CONFIG.cameraSmoothing * dt);
      camera.lookAt(cameraTarget);

      // Move sun shadow with player
      sunLight.position.set(
        vehicle.group.position.x + 50,
        80,
        vehicle.group.position.z - 30
      );
      sunLight.target.position.copy(vehicle.group.position);
      sunLight.target.updateMatrixWorld();

      // Move ground with player
      ground.position.x = vehicle.group.position.x;
      ground.position.z = vehicle.group.position.z;

      // === UI ===
      const displaySpeed = Math.round(player.speed);
      speedometerEl.innerHTML = `${displaySpeed} <span>km/h</span>`;

      renderer.render(scene, camera);
    }

    // Initial setup
    ensureControlPoints(20);
    rebuildGlobalCurve();
    cameraPos.copy(camera.position);
    cameraTarget.set(0, 1, -10);

    animate();
  </script>
</body>
</html>
