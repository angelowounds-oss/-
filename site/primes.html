<script>const W=n=>Math.round(n).toLocaleString('ko-KR')+'원';

const N2=(n,d)=>(+n.toFixed(d)).toLocaleString('ko-KR');
const P=s=>{const a=s.split('-').map(Number);return new Date(a[0],a[1]-1,a[2])};
const DAYS=(a,b)=>Math.round((b-a)/864e5);
const FD=d=>d.getFullYear()+'.'+(d.getMonth()+1)+'.'+d.getDate();

const pad=n=>String(n).padStart(2,'0');
const _t=new Date();const TODAY=_t.getFullYear()+'-'+pad(_t.getMonth()+1)+'-'+pad(_t.getDate());
const IDS=["n"];
function compute(v){let n=Math.floor(v.n);if(!(n>=2)||n>1e12)return '2 이상 1조 이하의 자연수를 입력하세요.';const o=n,f={};for(let p=2;p*p<=n;p++){while(n%p===0){f[p]=(f[p]||0)+1;n/=p}}if(n>1)f[n]=(f[n]||0)+1;
const ks=Object.keys(f);const str=ks.map(k=>f[k]>1?k+'<sup>'+f[k]+'</sup>':k).join(' × ');return '<b>'+o+' = '+str+'</b><br>'+(ks.length===1&&f[ks[0]]===1?'소수입니다':'합성수입니다');}
function run(){const v={};IDS.forEach(i=>{const e=document.getElementById(i);v[i]=e.type==='number'?(e.value===''?NaN:+e.value):e.value});

IDS.forEach(i=>{const e=document.getElementById(i);e.addEventListener('input',run);e.addEventListener('change',run)});

run();</script>
