<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>만 나이 계산기 - 생년월일로 만 나이·띠 계산</title><meta name="description" content="생년월일을 입력하면 2023년 시행 만 나이 기준으로 나이, 연 나이, 띠, 다음 생일까지 남은 일수를 계산합니다.">

<link rel="stylesheet" href="style.css"></head><body>

<nav><a href="char-count.html">글자수 세기</a><a href="age.html">만 나이</a><a href="pyeong.html">평수 변환</a><a href="percent.html">퍼센트</a><a href="loan.html">대출 이자</a><a href="dday.html">D-day</a><a href="unit.html">단위 변환</a><a href="bmi.html">BMI</a></nav></header>
<main><h1>만 나이 계산기 - 생년월일로 만 나이·띠 계산</h1>
<div class="ad"><!-- AdSense 승인 후 여기에 광고 코드 삽입 --></div>
<div class="card"><label for="bd">생년월일</label><input type="date" id="bd">
<label for="bs">기준일 (비우면 오늘)</label><input type="date" id="bs">
<button onclick="calc()">계산하기</button><div class="result" id="r"></div></div>
<h2>만 나이 통일법이란?</h2><p>2023년 6월 28일부터 행정·민사 영역에서 만 나이를 사용합니다. 태어난 날을 0세로 하고 생일이 지날 때마다 1살씩 더합니다. 연 나이(기준연도 - 출생연도)는 병역·청소년 보호 등 일부 법령에서만 쓰입니다.</p>
<div class="ad"><!-- AdSense 승인 후 여기에 광고 코드 삽입 --></div>
</main>
<footer><a href="privacy.html">개인정보처리방침</a> · 입력한 내용은 서버로 전송되지 않고 브라우저에서만 처리됩니다.</footer>
<script>function calc(){const bv=document.getElementById('bd').value;if(!bv){r.textContent='생년월일을 입력하세요';return}
const b=new Date(bv),s=document.getElementById('bs').value?new Date(document.getElementById('bs').value):new Date();
let age=s.getFullYear()-b.getFullYear();const m=s.getMonth()-b.getMonth();if(m<0||(m===0&&s.getDate()<b.getDate()))age--;
const yr=s.getFullYear()-b.getFullYear();const z=['원숭이','닭','개','돼지','쥐','소','호랑이','토끼','용','뱀','말','양'][b.getFullYear()%12];
let nb=new Date(s.getFullYear(),b.getMonth(),b.getDate());if(nb<new Date(s.getFullYear(),s.getMonth(),s.getDate()))nb=new Date(s.getFullYear()+1,b.getMonth(),b.getDate());
const dd=Math.ceil((nb-new Date(s.getFullYear(),s.getMonth(),s.getDate()))/864e5);
r.innerHTML='만 '+age+'세 · 연 나이 '+yr+'세 · '+z+'띠<br>다음 생일까지 '+dd+'일';}</script></body></html>
