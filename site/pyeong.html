<main><h1>평수 계산기 - 평 ㎡ 변환</h1>
<div class="ad"><!-- AdSense 승인 후 여기에 광고 코드 삽입 --></div>
<div class="card"><label for="p">평</label><input type="number" id="p" step="any" placeholder="예: 32">
<label for="m">제곱미터 (㎡)</label><input type="number" id="m" step="any" placeholder="예: 84.9"></div>
<h2>평수 환산 공식</h2><p>1평 = 약 3.3058㎡, 1㎡ = 약 0.3025평입니다. 아파트 "84㎡"는 약 25.4평이며, 흔히 말하는 34평형은 공급면적 기준입니다. 전용면적은 실제 사용 공간, 공급면적은 전용면적에 공용 공간을 더한 값입니다.</p>
<div class="ad"><!-- AdSense 승인 후 여기에 광고 코드 삽입 --></div>
</main>
<footer><a href="privacy.html">개인정보처리방침</a> · 입력한 내용은 서버로 전송되지 않고 브라우저에서만 처리됩니다.</footer>
<script>const K=3.305785;p.addEventListener('input',()=>{m.value=p.value===''?'':+(p.value*K).toFixed(2)});
m.addEventListener('input',()=>{p.value=m.value===''?'':+(m.value/K).toFixed(2)});</script></body></html>
